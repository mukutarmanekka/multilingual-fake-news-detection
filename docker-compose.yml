version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fakenews_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fnews
      POSTGRES_PASSWORD: fnews_secret
      POSTGRES_DB: fakenews
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnews -d fakenews"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: fakenews_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  pgdata:
  qdrant_data:
